<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Botanical garden — preview</title>
  <link rel="preload" href="assets/images/hero-botanical.png" as="image" fetchpriority="high">
  <link rel="preload" href="assets/fonts/cormorant-regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face{font-family:Cormorant;src:url('assets/fonts/cormorant-regular.woff2') format('woff2');font-display:swap}
    @font-face{font-family:Cormorant;src:url('assets/fonts/cormorant-italic.woff2') format('woff2');font-display:swap;font-style:italic}
    @font-face{font-family:Manrope;src:url('assets/fonts/manrope-regular.woff2') format('woff2');font-display:swap}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#8e886f}.hero{position:relative;width:100%;min-height:100%;display:grid;place-items:center;padding:24px;color:#2f2926;text-align:center;background:url('assets/images/hero-botanical.png') center/cover}.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(244,239,220,.04),rgba(61,57,38,.14))}.plaque{position:relative;z-index:1;width:min(84vw,370px);margin-top:-8vh;padding:0 20px}.monogram{position:relative;width:38px;height:38px;margin:0 auto 9px;display:grid;place-items:center;border:1px solid #71674e;border-radius:50%;font:italic 18px Cormorant,serif}.small{position:relative;margin:0;font:600 7px Manrope,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#5d5747}.names{position:relative;margin:13px 0 0;font:400 clamp(42px,13vw,68px)/.77 Cormorant,serif}.names span{display:block}.names i{display:block;margin:8px 0;font-size:.5em}.date{position:relative;margin:24px 0 0;font:600 9px Manrope,sans-serif;letter-spacing:.2em;text-transform:uppercase}
  </style>
</head>
<body>
  <main class="hero">
    <section class="plaque">
      <div class="monogram">БА</div>
      <p class="small">Wedding day</p>
      <h1 class="names"><span>Бекзат</span><i>&amp;</i><span>Алина</span></h1>
      <p class="date">12 июня 2027</p>
    </section>
  </main>
</body>
</html>
